_base_: ../stage4_joint.yaml

data:
  manifest: Manifests/joint_folds/manifest_joint_fold0.csv
  root: .
  target_size: [512, 512]
  normalization: fixed

train:
  output_dir: runs/current/stage4_joint_fold0
  pretrained: runs/current/stage2_segment_fold0/best.pth
  monitor: vessel_soft_dice
  # 512x512 joint training performs several forwards per batch. Batch 1 plus
  # two-step accumulation is safer on a 24 GB GPU while retaining batch-2 gradients.
  batch_size: 1
  gradient_accumulation_steps: 2
