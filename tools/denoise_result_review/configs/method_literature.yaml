  - method_id: tcfl_dncnn
    display_name: TCFL-DnCNN
    category: adversarial cross-fusion denoising
    supervision: unpaired
    original_paper_title: Triplet Cross-Fusion Learning for Unpaired Image Denoising in Optical Coherence Tomography
    authors: M. Geng et al.
    venue: IEEE Transactions on Medical Imaging
    year: 2022
    volume: 41(12)
    pages: 3735-3747
    doi: 10.1109/TMI.2022.3184529
    paper_url: https://pubmed.ncbi.nlm.nih.gov/35724282/
    official_code_url: https://github.com/gengmufeng/TCFL-OCT
    core_principle: Learns OCT denoising without paired noisy-clean acquisitions through triplet cross-fusion adversarial and pixel-consistency objectives.
    main_components: [DnCNN-like generator, discriminator, triplet cross-fusion, adversarial losses, cross-fusion L1 terms]
    strengths: [OCT-specific unpaired training, avoids exact paired acquisition requirement]
    limitations: [adversarial training complexity, source implementation and deviations must be audited]
    oct_specific: true
    current_implementation_notes: Inference uses only the generator; official-source commit and deviations are read from extension audit/config files.
