[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sabids-net"
version = "0.2.0"
description = "Sparse-annotation-aware bidirectional OCT denoising and choroid segmentation"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.1",
  "torchvision>=0.16",
  "numpy>=1.24",
  "pillow>=10.0",
  "pandas>=2.0",
  "opencv-python>=4.8",
  "PyYAML>=6.0",
  "scipy>=1.10",
  "tqdm>=4.66",
  "tensorboard>=2.14",
  "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["sabids*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
